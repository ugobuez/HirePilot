# Render Blueprint for HirePilot.
#
# Two services, two repos of dependencies — do NOT combine their builds:
#   • hirepilot-api     (Express API, root dir: server)  -> Web Service
#   • hirepilot-web     (React client, root dir: client) -> Static Site
#
# The `render:build` / `render:start` scripts referenced below live in the root
# package.json and run `npm ci` (lockfile-exact) in each service directory.
# Values marked `sync: false` are NOT stored here; set them in the Render
# dashboard. Never commit real secrets into this file.

services:
  # ------------------------------------------------------------------ API ----
  - type: web
    name: hirepilot-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    # /api/health reports 503 while Mongo is disconnected, so Render will not
    # route traffic to an instance whose database is not ready. /api/health/live
    # (process liveness) and /api/health/ready (DB readiness) also exist.
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20.11.0"
      - key: NODE_ENV
        value: production
      # config/index.js throws on boot if any of these are missing in prod.
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # At least one LLM provider key is required for AI features; the server
      # skips any provider whose key is absent rather than crashing.
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Job-source keys are optional (features degrade gracefully without them).
      - key: ADZUNA_CLIENT_ID
        sync: false
      - key: ADZUNA_API_KEY
        sync: false
      - key: JSEARCH_API_KEY
        sync: false
      # Optional: comma-separated allow-list of browser origins for credentialed
      # CORS. The built-in default already allows the canonical Vercel frontend
      # (https://hire-pilot-job.vercel.app). Set this only to add extra domains;
      # never use "*" (the API sends credentials).
      - key: CORS_ORIGINS
        sync: false

  # --------------------------------------------------------------- CLIENT ----
  - type: web
    name: hirepilot-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20.11.0"
      # Points the built React bundle at the API service's public URL.
      # Set this to the hirepilot-api URL shown on its Render page.
      - key: REACT_APP_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
